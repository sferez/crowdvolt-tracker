name: track

# Hourly reading of every event that is due. Which events those are is decided
# by store.TIERS: a show this week is re-read every hour, one this month every
# 3 hours, anything further out every 6 -- roughly a third of the requests a
# flat hourly sweep would make, with full resolution where prices actually move.
#
# State lives in the R2 bucket, not in this repo. A run pulls index.json and
# recent.json, appends one reading to the buffer, and writes those two objects
# back; nothing is ever committed. The per-event history files are rewritten
# once a day by the discovery workflow.

on:
  schedule:
    - cron: "7 * * * *"       # :07 every hour, UTC. GitHub's scheduler is
                              # best-effort and often runs minutes late; a
                              # missed hour is just a gap in the chart.
  workflow_dispatch:
    inputs:
      all:
        description: "Ignore the read-frequency tiers and read every event"
        type: boolean
        default: false

concurrency:
  group: crowdvolt-store      # shared with discover.yml -- only one writer
  cancel-in-progress: false    # never kill a run mid-write

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fail loudly rather than "succeeding" while writing to a local mirror
      # that this runner throws away thirty seconds later.
      - name: Check store credentials
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          python3 - <<'PY'
          import sys, r2
          r = r2.Remote()
          if not r.enabled:
              sys.exit("The R2_* secrets are not all set on this repository -- "
                       "the run would write to a mirror the runner then throws "
                       "away. See the README for the five names.")
          print(f"store reachable at {r.base}")
          PY

      - name: Take a reading
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          python3 track.py --delay 1.5 ${{ inputs.all && '--all' || '' }} \
            | tee /tmp/track.log

      - name: Summary
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          {
            echo "### Reading"
            echo '```'
            head -1 /tmp/track.log 2>/dev/null || echo "(no output)"
            grep -E "retired|pushed|!!" /tmp/track.log 2>/dev/null | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
